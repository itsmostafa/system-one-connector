name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run Release Please
        # Requires release-please >=17.2.0 to honor force-tag-creation for drafts.
        # Without the tag, PR generation replays already-released commits.
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

  build-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          # Build the tagged commit, not whatever push triggered this run.
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
      - name: Build, checksum and upload assets
        env:
          CGO_ENABLED: 0
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          for goos in darwin linux; do
            for goarch in amd64 arm64; do
              GOOS=$goos GOARCH=$goarch go build -ldflags="-s -w -X main.version=${TAG}" -o jev ./cmd/jev
              tar -czf "jev-${goos}-${goarch}.tar.gz" jev LICENSE
            done
          done
          sha256sum jev-*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" jev-*.tar.gz SHA256SUMS.txt --clobber --repo ${{ github.repository }}

  verify-release:
    needs: [release-please, build-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ needs.release-please.outputs.tag_name }}" --draft=false --repo ${{ github.repository }}
      - name: Verify install.sh end to end
        run: JEV_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
