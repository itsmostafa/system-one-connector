version: '3'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  build:
    desc: Build the evaluate binary
    cmds:
      - go build -o evaluate ./cmd/evaluate
    sources:
      - cmd/**/*.go
      - cmd/**/*.ts
      - go.mod
      - go.sum
    generates:
      - evaluate

  test:
    desc: Run tests with the race detector
    cmds:
      - go test -race -count=1 ./...

  lint:
    desc: Check formatting and vet
    cmds:
      - test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - go vet ./...

  fmt:
    desc: Format Go code
    cmds:
      - gofmt -w .

  check:
    desc: Lint and test
    cmds:
      - task: lint
      - task: test

  install:
    desc: Install evaluate into GOBIN
    cmds:
      - go install ./cmd/evaluate

  inspect:
    desc: Open the MCP Inspector against the server
    deps: [build]
    cmds:
      - npx @modelcontextprotocol/inspector ./evaluate mcp

  eval:
    desc: Run the tax-categorization eval for one profile (PROFILE=jev, PROTOCOL=choice|noul, LIMIT=10 for a smoke run, NAME=jev.p1 to name a pass)
    deps: [build]
    dir: eval
    cmds:
      - go run ./taxcat run -profile {{.PROFILE}} -protocol {{.PROTOCOL | default "choice"}} -limit {{.LIMIT | default 0}}{{if .NAME}} -name {{.NAME}}{{end}}
    requires:
      vars: [PROFILE]

  eval:all:
    desc: Run the tax-categorization eval for every profile in PROFILES, PASSES times each as <profile>.p1, .p2, ... (PASSES=3, LIMIT=5 for a smoke run); a failed pass is reported at the end without stopping the rest
    deps: [build]
    dir: eval
    vars:
      PROFILES: '{{.PROFILES | default "jev-1.14 d1 d1.1-liquid d1-ultra pplx-decider-flash-v1.2 pplx-decider-flash-v1.2-mac pplx-decider-v1.2 solar-decide clef clef-flash kev-4b gpt-6-luna-decisions"}}'
    cmds:
      - |
        failed=""
        for p in {{.PROFILES}}; do
          for i in $(seq 1 {{.PASSES | default 3}}); do
            go run ./taxcat run -profile "$p" -limit {{.LIMIT | default 0}} -name "$p.p$i" || failed="$failed $p.p$i"
          done
        done
        if [ -n "$failed" ]; then echo "failed passes:$failed" >&2; exit 1; fi

  eval:score:
    desc: Score every saved eval run as Markdown
    dir: eval
    cmds:
      - go run ./taxcat score

  eval:codenav:fetch:
    desc: Fetch a code-search suite's repository at its pinned commit (SUITE=transformers|vllm)
    dir: eval
    cmds:
      - go run ./codenav fetch -suite {{.SUITE | default "transformers"}}

  eval:codenav:
    desc: Run a code-search suite for one profile (SUITE=transformers|vllm, PROFILE=d1, LIMIT=3 for a smoke run, NAME=d1.p1 to name a pass)
    deps: [build]
    dir: eval
    cmds:
      - task: eval:codenav:fetch
        vars: {SUITE: "{{.SUITE}}"}
      - go run ./codenav run -suite {{.SUITE | default "transformers"}} -profile {{.PROFILE}} -limit {{.LIMIT | default 0}}{{if .NAME}} -name {{.NAME}}{{end}}
    requires:
      vars: [PROFILE]

  eval:codenav:score:
    desc: Score every saved run of a code-search suite as Markdown (SUITE=transformers|vllm, BASELINE=d1 for the cost multiple)
    dir: eval
    cmds:
      - go run ./codenav score -suite {{.SUITE | default "transformers"}} -baseline {{.BASELINE | default "d1"}}

  tidy:
    desc: Tidy go.mod
    cmds:
      - go mod tidy
